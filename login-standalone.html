<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dan Liris - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group input:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .remember-me input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
            cursor: pointer;
        }

        .remember-me label {
            font-size: 14px;
            color: #666;
            cursor: pointer;
            margin: 0;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background-color: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 12px;
            border-radius: 5px;
            margin-top: 15px;
            font-size: 14px;
            display: none;
            animation: shake 0.3s;
        }

        .error-message.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .success-message {
            background-color: #efe;
            border: 1px solid #cfc;
            color: #3c3;
            padding: 12px;
            border-radius: 5px;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading {
            display: none;
        }

        .loading.show {
            display: inline-block;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: none;
            animation: slideInRight 0.3s ease-out;
            z-index: 1000;
        }

        .toast.show {
            display: block;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Dan Liris</h1>
            <p>Sign in to your account</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="Enter your username" 
                    required 
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password" 
                    required
                >
            </div>

            <div class="remember-me">
                <input type="checkbox" id="rememberMe" name="rememberMe">
                <label for="rememberMe">Remember me</label>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="loading" id="loadingSpinner"></span>
                <span id="btnText">Sign In</span>
            </button>

            <div class="error-message" id="errorMessage">
                You have entered an invalid username or password
            </div>

            <div class="success-message" id="successMessage">
                Login successful! Redirecting...
            </div>
        </form>

        <div class="footer-text">
            &copy; 2025 Dan Liris. All rights reserved.
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- JSEncrypt library for RSA encryption -->
    <script src="https://cdn.jsdelivr.net/npm/jsencrypt@3.3.2/bin/jsencrypt.min.js"></script>
    
    <script>
        // Configuration
        const CONFIG = {
            AUTH_URL: 'https://com-danliris-service-auth-v8-dev.azurewebsites.net/v1/',
            LOGIN_ENDPOINT: 'authenticate',
            PROFILE_ENDPOINT: 'me',
            REDIRECT_URL: '/index.html', // Redirect ke aplikasi Aurelia setelah login
            PUBLIC_KEY: `-----BEGIN PUBLIC KEY-----MIIBCgKCAQEAyUDO910BLcBrwdscKorajZKQJdR9TNnR/oqNcTpL10C4Ts9JQq4djGlcxdIG09rm23x5r54/eFmthu4lpeSBEPsS9O4ai0SF0mA39n5lvfNzWJ/JNBYswXU0S2BoTKdClbme+Z1hhqwksej+y2r+AzxiUay23Tn/AvIRxmPQg/66lD6zNyTWHOHAowhdOLUF8GagwdNOeCC0BZDdjP7Iyrk0d5XYeffMAcNR2vLTDpreMcjda7fGHbDTu8khsFTpFDwub0Pg96lxbFV9i//dZ7sPl+RpIrrLV9alCuDyz4+86Sl1jVqbwyh4j4XjgYck1CcmDg5cWN5iB9MnHJZaAQIDAQAB-----END PUBLIC KEY-----`
        };

        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const rememberMeCheckbox = document.getElementById('rememberMe');
        const loginBtn = document.getElementById('loginBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const btnText = document.getElementById('btnText');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const toast = document.getElementById('toast');

        // Generate UUID v4
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // Show toast notification
        function showToast(message, duration = 3000) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // Set loading state
        function setLoading(isLoading) {
            loginBtn.disabled = isLoading;
            if (isLoading) {
                loadingSpinner.innerHTML = '<div class="spinner"></div>';
                loadingSpinner.classList.add('show');
                btnText.textContent = 'Signing In...';
            } else {
                loadingSpinner.classList.remove('show');
                loadingSpinner.innerHTML = '';
                btnText.textContent = 'Sign In';
            }
        }

        // Hide messages
        function hideMessages() {
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
        }

        // Show error
        function showError(message = 'You have entered an invalid username or password') {
            hideMessages();
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        // Show success
        function showSuccess(message = 'Login successful! Redirecting...') {
            hideMessages();
            successMessage.textContent = message;
            successMessage.classList.add('show');
        }

        // Save to local storage
        function saveToken(token, profile) {
            localStorage.setItem('aurelia_token', token);
            if (profile) {
                localStorage.setItem('aurelia_profile', JSON.stringify(profile));
            }
        }

        // Get profile from API
        async function getProfile(token) {
            try {
                const response = await fetch(CONFIG.AUTH_URL + CONFIG.PROFILE_ENDPOINT, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    return await response.json();
                }
                return null;
            } catch (error) {
                console.error('Error fetching profile:', error);
                return null;
            }
        }

        // Encrypt credentials
        function encryptCredentials(username, password) {
            try {
                const credentials = {
                    username: username,
                    password: password,
                    nonce: generateUUID(),
                    timestamp: new Date().toISOString()
                };

                const encrypt = new JSEncrypt();
                encrypt.setPublicKey(CONFIG.PUBLIC_KEY);
                const encrypted = encrypt.encrypt(JSON.stringify(credentials));
                
                return encrypted;
            } catch (error) {
                console.error('Encryption error:', error);
                throw new Error('Failed to encrypt credentials');
            }
        }

        // Handle login
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }

            setLoading(true);
            hideMessages();

            try {
                // Encrypt credentials
                const authEncrypted = encryptCredentials(username, password);

                // Send login request
                const response = await fetch(CONFIG.AUTH_URL + CONFIG.LOGIN_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ authEncrypted })
                });

                const data = await response.json();

                if (response.ok && data.data) {
                    // Login successful
                    const token = data.data;
                    
                    // Get user profile
                    const profile = await getProfile(token);
                    
                    // Save token and profile
                    saveToken(token, profile);
                    
                    // Remember me functionality
                    if (rememberMeCheckbox.checked) {
                        localStorage.setItem('rememberedUsername', username);
                    } else {
                        localStorage.removeItem('rememberedUsername');
                    }
                    
                    showSuccess('Login successful! Redirecting...');
                    showToast('Welcome back!');
                    
                    // Redirect to main app
                    setTimeout(() => {
                        window.location.href = CONFIG.REDIRECT_URL;
                    }, 1500);
                    
                } else {
                    // Login failed
                    showError(data.message || 'Invalid username or password');
                    console.error('Login failed:', data);
                }

            } catch (error) {
                console.error('Login error:', error);
                showError('An error occurred. Please try again.');
            } finally {
                setLoading(false);
            }
        }

        // Initialize
        function init() {
            // Load remembered username
            const rememberedUsername = localStorage.getItem('rememberedUsername');
            if (rememberedUsername) {
                usernameInput.value = rememberedUsername;
                rememberMeCheckbox.checked = true;
                passwordInput.focus();
            }

            // Check if already logged in
            const existingToken = localStorage.getItem('aurelia_token');
            if (existingToken) {
                // Verify token is still valid
                getProfile(existingToken).then(profile => {
                    if (profile) {
                        showToast('Already logged in. Redirecting...');
                        setTimeout(() => {
                            window.location.href = CONFIG.REDIRECT_URL;
                        }, 1000);
                    }
                });
            }

            // Add event listener
            loginForm.addEventListener('submit', handleLogin);
        }

        // Run initialization when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
